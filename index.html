<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1117;--surface:#161b24;--surface-raised:#1d2330;--line:#262e3c;--track:#232a36;
  --ink:#e6e8ee;--ink-strong:#fff;--ink-soft:#c9cfdb;--muted:#9aa3b5;--faint:#7c8598;
  --accent:#7dd3fc;--accent-2:#c4b5fd;--accent-3:#fcd34d;--on-accent:#0e1117;
  --sans:"Rubik","Noto Sans Arabic",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit}
a{color:inherit}
.container{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}

/* nav */
nav.top{position:sticky;top:0;z-index:5;background:rgba(14,17,23,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .container{display:flex;align-items:center;gap:20px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-strong);font-weight:700;font-size:19px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--on-accent);font-family:var(--mono);font-size:13px;font-weight:700}
.links{display:flex;gap:4px;flex:1}
.links a{text-decoration:none;color:var(--muted);font-size:14.5px;padding:8px 14px;border-radius:999px;transition:background .15s,color .15s}
.links a:hover{color:var(--ink);background:var(--surface)}
.links a.on{color:var(--ink-strong);background:var(--surface-raised)}
.links a .dot{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-inline-end:7px;vertical-align:middle}
.navsearch{position:relative;width:250px}
.navsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--ink);font:14px var(--sans);padding:9px 16px;outline:none}
.navsearch input:focus{border-color:var(--muted)}
.navsearch input::placeholder{color:var(--faint)}

main{flex:1}
.view{display:none}
.view.on{display:block}

/* home */
.hero{padding:64px 0 36px}
.hero .path{font-family:var(--mono);font-size:12px;color:var(--accent)}
.hero h1{margin:10px 0 10px;font-size:46px;line-height:1.15;color:var(--ink-strong);font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.7;max-width:560px}
.stats{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:120px}
.stat b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink-strong);font-weight:700}
.stat span{font-size:13px;color:var(--muted)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 14px}
.sec-title h2{margin:0;font-size:20px;color:var(--ink-strong);font-weight:500}
.sec-title span{font-family:var(--mono);font-size:12px;color:var(--faint)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ccard{position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 22px 20px;overflow:hidden;transition:border-color .15s,transform .15s}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.ccard:hover{border-color:var(--c);transform:translateY(-2px)}
.ccard .code{font-family:var(--mono);font-size:12px;color:var(--c)}
.ccard h3{margin:4px 0 0;font-size:21px;line-height:1.35;color:var(--ink-strong);direction:ltr;text-align:right}
.ccard .chips{display:flex;gap:6px;flex-wrap:wrap}
.ccard .chips span{font-size:12.5px;color:var(--ink-soft);background:var(--surface-raised);border-radius:999px;padding:5px 11px}
.ccard .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13.5px}
.ccard .go b{color:var(--c);font-weight:500}
.ccard.soon{opacity:.55;cursor:default}
.ccard.soon:hover{transform:none;border-color:var(--line)}
.recent{display:flex;gap:10px;flex-wrap:wrap}
.recent button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;text-align:right;min-width:200px}
.recent button:hover{border-color:var(--c)}
.recent button small{font-family:var(--mono);font-size:11px;color:var(--c)}

/* course page */
.chead{padding:44px 0 6px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--ink)}
.crumb b{color:var(--c);font-weight:400}
.chead h1{margin:10px 0 6px;font-size:38px;line-height:1.2;color:var(--ink-strong);direction:ltr;text-align:right}
.chead p{margin:0;color:var(--muted);font-size:14.5px}
.subnav{position:sticky;top:62px;z-index:4;background:rgba(14,17,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:22px;border-bottom:1px solid var(--line)}
.subnav .container{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.subnav .container::-webkit-scrollbar{display:none}
.subnav button{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer}
.subnav button:hover{border-color:var(--c);color:var(--ink)}
.subnav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--c);margin-inline-start:6px}
.group{padding-top:30px;scroll-margin-top:130px}
.group h3{font-size:16px;font-weight:500;color:var(--ink-strong);margin:0 0 12px;display:flex;align-items:center;gap:9px}
.group h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.group h3 em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.file{display:flex;flex-direction:column;gap:10px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s;min-height:92px}
.file:hover,.file:focus-visible{border-color:var(--c);background:var(--surface-raised);outline:none}
.file .t{font-size:15px;line-height:1.45;font-weight:500;color:var(--ink-strong)}
.file .m{margin-top:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:10px;direction:ltr;justify-content:flex-end}
.file .m b{color:var(--c);font-weight:400}
.file .cname{font-family:var(--mono);font-size:11px;color:var(--c)}

/* search page */
.shead{padding:44px 0 10px}
.shead h1{margin:0;font-size:28px;color:var(--ink-strong)}
.shead p{color:var(--muted);margin:6px 0 0}
.empty{color:var(--muted);padding:40px 0;text-align:center}

footer{margin-top:64px;border-top:1px solid var(--line)}
footer .container{display:flex;justify-content:space-between;padding-top:18px;padding-bottom:24px;font-family:var(--mono);font-size:11px;color:var(--faint);direction:ltr}

/* viewer */
.viewer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.viewer.open{display:flex}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.vbar .vt{flex:1;min-width:0}
.vbar .vt .path{font-family:var(--mono);font-size:11px;color:var(--c)}
.vbar .vt div:last-child{font-size:15px;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{background:var(--surface-raised);border:1px solid var(--line);color:var(--ink);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.vbtn:hover{border-color:var(--muted)}
.pg{font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;min-width:64px;text-align:center}
.pages{flex:1;overflow:auto;padding:18px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.page{background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.page canvas{display:block;width:100%;height:100%;border-radius:6px}
.status{color:var(--muted);font-size:14px;margin-top:40px;text-align:center}
.prog{width:200px;height:6px;border-radius:999px;background:var(--track);margin:12px auto 0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .2s}

@media (max-width:760px){
  nav.top .container{height:auto;flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px}
  .links{order:3;flex-basis:100%;overflow-x:auto}
  .navsearch{flex:1;width:auto}
  .subnav{top:108px}
  .group{scroll-margin-top:170px}
}
@media (max-width:600px){
  .container{padding:0 16px}
  .hero{padding:40px 0 24px}
  .hero h1{font-size:34px}
  .chead h1{font-size:28px}
  .grid{grid-template-columns:1fr 1fr}
  .file{padding:14px;min-height:84px}
  .file .t{font-size:14px}
  .hide-sm{display:none}
  .recent button{min-width:0;flex:1 1 100%}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top">
  <div class="container">
    <a class="brand" href="#home"><span class="mark">M</span>موادي</a>
    <div class="links" id="links"></div>
    <div class="navsearch"><input id="q" type="search" placeholder="دوّر على ملف…" autocomplete="off"></div>
  </div>
</nav>

<main>
  <section class="view" id="v-home">
    <div class="container">
      <div class="hero">
        <div class="path">FALL 2026 / home</div>
        <h1>كل موادك<br><span>في مكان واحد</span></h1>
        <p>المحاضرات والسكاشن والشيتات والملفات اللي اتعملت في الشاتات. افتح أي ملف من اللاب أو الموبايل من غير ما تدوّر على الجهاز.</p>
        <div class="stats" id="stats"></div>
      </div>
      <div id="recentWrap" style="display:none">
        <div class="sec-title"><h2>كمّل من حيث وقفت</h2><span>recent</span></div>
        <div class="recent" id="recent"></div>
      </div>
      <div class="sec-title"><h2>المواد</h2><span>courses</span></div>
      <div class="courses" id="courses"></div>
    </div>
  </section>

  <section class="view" id="v-course">
    <div class="container chead" id="chead"></div>
    <div class="subnav"><div class="container" id="subnav"></div></div>
    <div class="container" id="cbody"></div>
  </section>

  <section class="view" id="v-search">
    <div class="container">
      <div class="shead"><h1 id="stitle"></h1><p id="ssub"></p></div>
      <div class="grid" id="sres"></div>
      <div class="empty" id="sempty" style="display:none">مفيش ملف بالاسم ده.</div>
    </div>
  </section>
</main>

<footer><div class="container"><span>موادي · course materials</span><span id="total"></span></div></footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="vbar">
    <button class="vbtn" id="close" title="رجوع">✕</button>
    <div class="vt"><div class="path" id="vpath"></div><div id="vtitle"></div></div>
    <span class="pg" id="pg"></span>
    <button class="vbtn hide-sm" id="zout" title="تصغير">−</button>
    <button class="vbtn hide-sm" id="zin" title="تكبير">+</button>
    <a class="vbtn" id="raw" target="_blank" rel="noopener" title="افتح الملف لوحده">↗</a>
  </div>
  <div class="pages" id="pages"></div>
</div>

const COLORS = {dcs:'var(--accent)', graphics:'var(--accent-2)', dsp:'var(--accent-3)'};
const CODES = {dcs:'CMPN421', graphics:'CMPN322', dsp:'ELCn425'};
const SOON = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const all = [];
DATA.forEach(c => c.groups.forEach(g => g.items.forEach(it => { it.course = c; it.group = g; all.push(it); })));
const totalPages = all.reduce((a,x)=>a+x.pages,0);
$('#total').textContent = `${all.length} files · ${totalPages} pages`;

const fileCard = (it, showCourse) => `<button class="file" data-f="${it.f}" style="--c:${COLORS[it.course.id]}">${showCourse?`<span class="cname">${esc(it.course.short)} · ${esc(it.group.title)}</span>`:''}<span class="t">${esc(it.t)}</span><span class="m"><span><b>${it.pages}</b> pages</span><span>${it.mb} MB</span></span></button>`;

function renderNav(route){
  $('#links').innerHTML = `<a href="#home" class="${route==='home'?'on':''}">الرئيسية</a>` +
    DATA.map(c => `<a href="#${c.id}" style="--c:${COLORS[c.id]}" class="${route===c.id?'on':''}"><span class="dot"></span>${esc(c.short)}</a>`).join('');
}

function renderHome(){
  const fromChats = all.filter(x => x.group.id==='from-chats').length;
  $('#stats').innerHTML = [[DATA.length,'مادة'],[all.length,'ملف'],[totalPages,'صفحة'],[fromChats,'ملف من الشاتات']]
    .map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#courses').innerHTML = DATA.map(c => {
    const n = c.groups.reduce((a,g)=>a+g.items.length,0);
    return `<a class="ccard" href="#${c.id}" style="--c:${COLORS[c.id]}"><div><div class="code">${CODES[c.id]||''} · ${esc(c.short)}</div><h3>${esc(c.name)}</h3></div>
      <div class="chips">${c.groups.slice(0,5).map(g => `<span>${esc(g.title)} · ${g.items.length}</span>`).join('')}${c.groups.length>5?`<span>+${c.groups.length-5} أقسام</span>`:''}</div>
      <div class="go"><span>${n} ملف</span><b>افتح المادة ←</b></div></a>`;
  }).join('') + SOON.map(([id,name]) => `<div class="ccard soon" style="--c:var(--line)"><div><div class="code" style="color:var(--faint)">قريبًا</div><h3>${name}</h3></div><div class="go"><span>لسه ما اتضافتش</span></div></div>`).join('');
  const r = (store.get('recent')||[]).map(f => all.find(x => x.f===f)).filter(Boolean).slice(0,4);
  $('#recentWrap').style.display = r.length ? 'block' : 'none';
  $('#recent').innerHTML = r.map(it => `<button data-f="${it.f}" style="--c:${COLORS[it.course.id]}"><small>${esc(it.course.short)} · ${esc(it.group.title)}</small>${esc(it.t)}</button>`).join('');
}

function renderCourse(c){
  const n = c.groups.reduce((a,g)=>a+g.items.length,0);
  const pages = c.groups.reduce((a,g)=>a+g.items.reduce((b,x)=>b+x.pages,0),0);
  document.getElementById('v-course').style.setProperty('--c', COLORS[c.id]);
  $('#chead').innerHTML = `<div class="crumb"><a href="#home">home</a> / <b>${esc(c.short.toLowerCase())}</b></div><h1>${esc(c.name)}</h1><p>${n} ملف · ${pages} صفحة · <span dir="ltr">${CODES[c.id]||''}</span></p>`;
  $('#subnav').innerHTML = c.groups.map(g => `<button data-g="${c.id}-${g.id}">${esc(g.title)}<i>${g.items.length}</i></button>`).join('');
  $('#cbody').innerHTML = c.groups.map(g => `<section class="group" id="g-${c.id}-${g.id}"><h3>${esc(g.title)} <em>${g.items.length} files</em></h3><div class="grid">${g.items.map(it => fileCard(it,false)).join('')}</div></section>`).join('');
}

function renderSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const res = all.filter(it => (it.t+' '+it.group.title+' '+it.course.short+' '+it.course.name).toLowerCase().includes(q));
  $('#stitle').textContent = `نتايج «${$('#q').value.trim()}»`;
  $('#ssub').textContent = `${res.length} ملف`;
  $('#sres').innerHTML = res.map(it => fileCard(it,true)).join('');
  $('#sempty').style.display = res.length ? 'none' : 'block';
}

let lastRoute = null;
function route(){
  const h = location.hash.replace('#','');
  const isFile = h.endsWith('-file');
  if(!isFile && viewer.classList.contains('open')) closeViewer(true);
  if(isFile && !viewer.classList.contains('open')){ history.replaceState(null,'', '#'+h.replace(/-file$/,'')); return route(); }
  const base = isFile ? h.replace(/-file$/,'') : (h || 'home');
  if(base!=='search') $('#q').value='';
  if(base === lastRoute) return;
  lastRoute = base;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  const c = DATA.find(x => x.id===base);
  if(base==='search'){ renderSearch(); $('#v-search').classList.add('on'); renderNav('search'); }
  else if(c){ renderCourse(c); $('#v-course').classList.add('on'); renderNav(c.id); }
  else { renderHome(); $('#v-home').classList.add('on'); renderNav('home'); lastRoute='home'; }
  window.scrollTo(0,0);
}

// ---------- viewer ----------
let doc = null, token = 0, scale = 1, observer = null;
const viewer = $('#viewer'), pagesEl = $('#pages');

async function openFile(f){
  const it = all.find(x => x.f===f); if(!it) return;
  const r = (store.get('recent')||[]).filter(x => x!==f); r.unshift(f); store.set('recent', r.slice(0,6));
  viewer.style.setProperty('--c', COLORS[it.course.id]);
  $('#vpath').textContent = `${it.course.short.toUpperCase()} / ${it.group.title}`;
  $('#vtitle').textContent = it.t;
  $('#raw').href = it.f;
  $('#pg').textContent = '';
  viewer.classList.add('open'); document.body.style.overflow = 'hidden';
  const cur = (location.hash.replace('#','') || 'home').replace(/-file$/,'');
  location.hash = cur + '-file';
  const my = ++token;
  if(doc){ doc.destroy(); doc = null; }
  pagesEl.innerHTML = `<div class="status">بيحمّل… <div class="prog"><i id="bar"></i></div></div>`;
  try{
    const task = pdfjsLib.getDocument({url: it.f});
    task.onProgress = p => { const b = $('#bar'); if(b && p.total) b.style.width = Math.round(p.loaded/p.total*100)+'%'; };
    const d = await task.promise;
    if(my !== token){ d.destroy(); return; }
    doc = d; scale = 1; await layout(my);
  }catch(e){
    if(my !== token) return;
    pagesEl.innerHTML = `<div class="status">الملف ما فتحش هنا. جرّب زرار ↗ فوق يفتحه لوحده.</div>`;
  }
}

async function layout(my){
  const first = await doc.getPage(1);
  const vp1 = first.getViewport({scale:1});
  const avail = Math.min(pagesEl.clientWidth - 20, 1000);
  const base = avail / vp1.width;
  pagesEl.innerHTML = '';
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries => entries.forEach(e => {
    const el = e.target, n = +el.dataset.n;
    if(e.isIntersecting){ draw(el, n, base*scale, my); $('#pg').textContent = `${n} / ${doc.numPages}`; }
  }), {root: pagesEl, rootMargin: '600px 0px'});
  for(let n=1; n<=doc.numPages; n++){
    const el = document.createElement('div');
    el.className = 'page'; el.dataset.n = n;
    el.style.width = vp1.width*base*scale+'px'; el.style.height = vp1.height*base*scale+'px';
    pagesEl.appendChild(el); observer.observe(el);
  }
  $('#pg').textContent = `1 / ${doc.numPages}`;
}

async function draw(el, n, s, my){
  if(el.dataset.done === String(s)) return;
  el.dataset.done = String(s);
  try{
    const page = await doc.getPage(n);
    if(my !== token) return;
    const vp = page.getViewport({scale: s});
    el.style.width = vp.width+'px'; el.style.height = vp.height+'px';
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width*dpr); c.height = Math.floor(vp.height*dpr);
    await page.render({canvasContext: c.getContext('2d'), viewport: vp, transform: dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
    if(my !== token) return;
    el.innerHTML = ''; el.appendChild(c);
  }catch(e){ el.dataset.done = ''; }
}

function closeViewer(fromRoute){
  token++; viewer.classList.remove('open'); document.body.style.overflow = '';
  if(observer) observer.disconnect();
  if(doc){ doc.destroy(); doc = null; }
  pagesEl.innerHTML = '';
  if(lastRoute==='home') renderHome();
  if(!fromRoute && location.hash.endsWith('-file')) history.back();
}
function zoom(f){ if(!doc) return; scale = Math.max(.5, Math.min(3, scale*f)); const top = pagesEl.scrollTop/pagesEl.scrollHeight; layout(token).then(()=>{ pagesEl.scrollTop = top*pagesEl.scrollHeight; }); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if(b){ openFile(b.dataset.f); return; }
  const g = e.target.closest('[data-g]'); if(g){ const el = document.getElementById('g-'+g.dataset.g); if(el) el.scrollIntoView({behavior:'smooth'}); }
});
let prevRoute = 'home';
$('#q').addEventListener('input', () => {
  const v = $('#q').value.trim();
  if(v){ if(lastRoute!=='search'){ prevRoute = lastRoute||'home'; location.hash = 'search'; } else renderSearch(); }
  else if(lastRoute==='search') location.hash = prevRoute;
});
$('#close').onclick = () => closeViewer(false);
$('#zin').onclick = () => zoom(1.25);
$('#zout').onclick = () => zoom(0.8);
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if(e.key==='Escape' && viewer.classList.contains('open')) closeViewer(false); });
if(location.hash==='#search') history.replaceState(null,'','#home');
route();
</script>
</body>
</html>
